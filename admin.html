<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>삐약궁합 관리자</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #2a2a33;
    --muted: #767686;
    --accent: #b5650d;
    --accent-soft: #fff3d6;
    --border: #e8e4da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171c;
      --card: #212127;
      --text: #ececf1;
      --muted: #9797a3;
      --accent: #ffb74d;
      --accent-soft: #3a2f1c;
      --border: #34343c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171c; --card: #212127; --text: #ececf1; --muted: #9797a3; --accent: #ffb74d; --accent-soft: #3a2f1c; --border: #34343c;
  }
  :root[data-theme="light"] {
    --bg: #f6f5f2; --card: #ffffff; --text: #2a2a33; --muted: #767686; --accent: #b5650d; --accent-soft: #fff3d6; --border: #e8e4da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

  #loginCard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  #loginCard label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  #loginCard input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    margin-bottom: 12px;
  }
  #loginCard button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #loginError { color: #e0245e; font-size: 13px; margin-top: 8px; display: none; }

  #dashboard { display: none; }
  .summary-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .stat-card .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stat-card .value { font-size: 28px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .section h2 { font-size: 15px; margin: 0 0 16px; color: var(--muted); font-weight: 700; }

  .day-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .day-row .day-label { width: 64px; color: var(--muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .day-row .bar-track { flex: 1; height: 18px; background: var(--accent-soft); border-radius: 6px; overflow: hidden; }
  .day-row .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; }
  .day-row .day-count { width: 32px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  .tab-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
  .tab-row .tab-label { width: 92px; flex-shrink: 0; }
  .tab-row .bar-track { flex: 1; height: 20px; background: var(--accent-soft); border-radius: 6px; overflow: hidden; }
  .tab-row .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; }
  .tab-row .tab-count { width: 36px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  .log-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .log-row:last-child { border-bottom: none; }
  .log-row .log-pair { font-weight: 600; }
  .log-row .log-pair .sep { color: var(--muted); font-weight: 400; margin: 0 4px; }
  .log-row .log-meta { color: var(--muted); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  .log-row .log-tab {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 8px;
  }
  #emptyLog { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; display: none; }

  .log-row-inner { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .log-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .visitor-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .visitor-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .visitor-repeat { color: var(--accent); font-weight: 700; }

  #refreshBtn {
    display: block;
    margin: 0 auto 20px;
    padding: 10px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  #dashError { color: #e0245e; font-size: 13px; text-align: center; display: none; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐥 삐약궁합 관리자</h1>
  <p class="sub">방문·기능별 사용 통계</p>

  <div id="loginCard">
    <label for="pwInput">관리자 비밀번호</label>
    <input type="password" id="pwInput" placeholder="비밀번호 입력">
    <button id="loginBtn">확인</button>
    <p id="loginError">비밀번호가 올바르지 않아요.</p>
  </div>

  <div id="dashboard">
    <button id="refreshBtn">🔄 새로고침</button>
    <p id="dashError">통계를 불러오지 못했어요.</p>

    <div class="summary-row">
      <div class="stat-card">
        <div class="label">누적 방문</div>
        <div class="value" id="totalVisits">-</div>
      </div>
      <div class="stat-card">
        <div class="label">오늘 방문</div>
        <div class="value" id="todayVisits">-</div>
      </div>
    </div>

    <div class="section">
      <h2>최근 7일 방문</h2>
      <div id="dailyChart"></div>
    </div>

    <div class="section">
      <h2>기능별 조회수 (많은 순)</h2>
      <div id="tabChart"></div>
    </div>

    <div class="section">
      <h2>최근 궁합 기록 (누가 누구랑 봤는지)</h2>
      <div id="logList"></div>
      <p id="emptyLog">아직 기록이 없어요.</p>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function login() {
  const pw = $('pwInput').value;
  if (!pw) return;
  $('loginError').style.display = 'none';
  await loadStats(pw);
}

async function loadStats(pw) {
  $('dashError').style.display = 'none';
  try {
    const res = await fetch('/api/stats?password=' + encodeURIComponent(pw));
    if (res.status === 401) {
      $('loginError').style.display = 'block';
      return;
    }
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    sessionStorage.setItem('bbiyak_admin_pw', pw);
    render(data);
    $('loginCard').style.display = 'none';
    $('dashboard').style.display = 'block';
  } catch (e) {
    $('dashError').style.display = 'block';
  }
}

function relTime(ts) {
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return '방금 전';
  if (min < 60) return `${min}분 전`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}시간 전`;
  const day = Math.floor(hr / 24);
  return `${day}일 전`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render(data) {
  $('totalVisits').textContent = data.totalVisits.toLocaleString();
  const today = data.dailyVisits[data.dailyVisits.length - 1];
  $('todayVisits').textContent = today ? today.count.toLocaleString() : '0';

  const maxDaily = Math.max(1, ...data.dailyVisits.map((d) => d.count));
  $('dailyChart').innerHTML = data.dailyVisits.map((d) => {
    const label = d.date.slice(5).replace('-', '/');
    const pct = Math.round((d.count / maxDaily) * 100);
    return `<div class="day-row">
      <span class="day-label">${label}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
      <span class="day-count">${d.count}</span>
    </div>`;
  }).join('');

  const maxTab = Math.max(1, ...data.tabClicks.map((t) => t.count));
  $('tabChart').innerHTML = data.tabClicks.map((t) => {
    const pct = Math.round((t.count / maxTab) * 100);
    return `<div class="tab-row">
      <span class="tab-label">${t.label}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
      <span class="tab-count">${t.count}</span>
    </div>`;
  }).join('');

  const logs = data.recentLogs || [];
  $('emptyLog').style.display = logs.length ? 'none' : 'block';

  // 방문자 ID별 총 등장 횟수(전체 로그 기준)와 색상 배정
  const vidCounts = {};
  logs.forEach((l) => { if (l.v) vidCounts[l.v] = (vidCounts[l.v] || 0) + 1; });
  const vidColor = (vid) => `hsl(${hashHue(vid)}, 60%, 55%)`;

  $('logList').innerHTML = logs.map((l) => {
    const n1 = esc(l.n1 || '이름 없음');
    const pairHtml = l.n2
      ? `${n1}<span class="sep">×</span>${esc(l.n2)}`
      : `${n1}`;
    const vid = l.v || '';
    const total = vid ? vidCounts[vid] : 0;
    const visitorBadge = vid
      ? `<span class="visitor-badge">
           <span class="visitor-dot" style="background:${vidColor(vid)}"></span>
           방문자 #${esc(vid.slice(-4))}${total > 1 ? ` <span class="visitor-repeat">· 이 목록에서 ${total}회</span>` : ''}
         </span>`
      : `<span class="visitor-badge">방문자 정보 없음</span>`;
    return `<div class="log-row">
      <div class="log-row-inner">
        <div class="log-row-top">
          <span class="log-pair"><span class="log-tab">${esc(l.label)}</span>${pairHtml}</span>
          <span class="log-meta">${relTime(l.t)}</span>
        </div>
        ${visitorBadge}
      </div>
    </div>`;
  }).join('');
}

function hashHue(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % 360;
}

$('loginBtn').addEventListener('click', login);
$('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('refreshBtn').addEventListener('click', () => {
  const pw = sessionStorage.getItem('bbiyak_admin_pw');
  if (pw) loadStats(pw);
});

const savedPw = sessionStorage.getItem('bbiyak_admin_pw');
if (savedPw) loadStats(savedPw);
</script>
</body>
</html>
