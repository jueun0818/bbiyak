<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="삐약궁합 이용자들이 궁합 결과와 자유글을 올리고 댓글・좋아요를 남기는 게시판입니다.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffc107">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>궁합 게시판 - 삐약궁합</title>
<style>
  :root{
    --pink: #ffc107;
    --purple: #b5650d;
    --bg1: #fffbe6;
    --bg2: #fff3c4;
    --card: #ffffff;
    --text: #3b3227;
    --muted: #8b7a63;
    --amber-strong: #ffa000;
    --amber-text: #c07f00;
    --grad-amber: linear-gradient(135deg, #ffcf3f, #ffa000);
    --line: #ffe7b3;
    --panel: #fffbf0;
  }
  * { box-sizing: border-box; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2.5px solid #ff8f00;
    outline-offset: 2px;
  }
  html {
    background: linear-gradient(168deg, #fffbea 0%, #ffedad 38%, #ffd966 100%);
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 80% at 15% 0%, rgba(255,224,110,0.9) 0%, rgba(255,224,110,0) 55%),
      radial-gradient(100% 70% at 92% 100%, rgba(255,183,40,0.5) 0%, rgba(255,183,40,0) 55%),
      linear-gradient(168deg, #fffbea 0%, #ffedad 38%, #ffd966 100%);
    background-attachment: fixed;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 20px 16px 64px;
    position: relative;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 560px; position: relative; z-index: 1; }

  .board-page-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 16px;
    flex-wrap: wrap;
  }
  .board-feedback-btn {
    width: auto;
    margin: 0 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px;
    background: #fff;
    color: #a3781c;
    font-size: 13px;
    font-weight: 700;
    border: 1.5px solid var(--line);
    box-shadow: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .board-back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #fff;
    color: #a3781c;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    border: 1.5px solid var(--line);
  }
  .board-page-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--purple);
    margin: 0;
  }

  .card {
    background: var(--card);
    border: 1.5px solid rgba(255,193,7,0.32);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow:
      0 1px 2px rgba(180,120,0,0.05),
      0 14px 30px -10px rgba(224,150,0,0.28);
    position: relative;
  }
  button {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #fff;
    background: var(--grad-amber);
    cursor: pointer;
    box-shadow: 0 8px 18px -7px rgba(224,150,0,0.75);
    transition: transform .1s, opacity .15s, box-shadow .15s;
  }
  button:active { transform: scale(0.98); box-shadow: 0 4px 10px -6px rgba(224,150,0,0.7); }
  button:disabled { opacity: 0.6; cursor: default; }
  select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    font-size: 18px;
    outline: none;
    font-family: inherit;
    color: var(--text);
    background: #fff;
  }
  .disclaimer {
    margin: 20px auto 0;
    max-width: 480px;
    padding: 12px 16px;
    border-radius: 14px;
    background: rgba(255,255,255,0.55);
    font-size: 12.5px;
    color: #867760;
    text-align: center;
    line-height: 1.65;
  }

  /* ---- 궁합 게시판 ---- */
  .board-card { padding: 22px 18px 26px; }
  .board-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .board-title { font-size: 17px; font-weight: 800; color: var(--purple); }
  .board-section-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--purple);
    margin: 18px 0 10px;
  }
  .board-list ~ .board-section-title { margin-top: 18px; }
  .board-list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .board-list-head .board-section-title { margin: 0; }
  .board-sort-toggle { display: flex; gap: 6px; }
  .board-sort-toggle button {
    width: auto;
    margin: 0;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    border: 1.5px solid var(--line);
    box-shadow: none;
  }
  .board-sort-toggle button.active {
    background: var(--grad-amber);
    color: #fff;
    border-color: transparent;
  }
  .board-result-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .board-result-strip:empty::after {
    content: '🎉 아직 올라온 궁합 결과가 없어요';
    font-size: 13.5px;
    color: var(--muted);
    padding: 8px 2px;
  }
  .board-result-card {
    flex: 0 0 auto;
    width: 168px;
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--accent, var(--amber-strong));
    border-radius: 16px;
    padding: 12px 13px;
    background: linear-gradient(160deg, #fffdf2, var(--panel));
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .board-result-card:active { transform: scale(0.97); }
  .board-result-card .board-result-nick {
    display: flex; align-items: center;
    font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px;
  }
  .board-result-card .board-result-names { font-size: 14px; font-weight: 800; color: var(--text); line-height: 1.3; }
  .board-result-card .board-result-score { font-size: 20px; font-weight: 800; color: var(--accent, var(--amber-text)); margin-top: 4px; }
  .board-result-card .board-result-tier { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .board-result-card .board-result-foot { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .board-avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 10.5px;
    font-weight: 800;
    color: #fff;
    margin-right: 6px;
    flex: 0 0 auto;
    text-shadow: 0 1px 1px rgba(0,0,0,0.15);
  }
  .board-comment .board-avatar { width: 18px; height: 18px; font-size: 9.5px; }
  .board-avatar.emoji { background: var(--panel); font-size: 13px; text-shadow: none; }
  .board-comment .board-avatar.emoji { font-size: 11px; }
  .board-avatar.photo { background: var(--panel); object-fit: cover; }

  .board-avatar-modal-inner { max-height: none; padding: 22px 20px 24px; }
  .board-avatar-modal-title { margin: 0 0 14px; font-size: 15.5px; font-weight: 800; color: var(--purple); text-align: center; }
  .board-avatar-photo-btn {
    background: #fff;
    color: #a3781c;
    border: 1.5px solid var(--line);
    box-shadow: none;
    padding: 12px;
    font-size: 14.5px;
    margin-bottom: 14px;
  }
  #boardFeedbackText {
    width: 100%;
    min-height: 100px;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    box-sizing: border-box;
  }
  #boardFeedbackText:focus { border-color: var(--amber-strong); }
  .board-feedback-note { margin: 10px 0 0; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
  .board-avatar-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .board-avatar-option {
    width: auto;
    margin: 0;
    padding: 0;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    border-radius: 14px;
    background: var(--panel);
    border: 1.5px solid var(--line);
    color: inherit;
    box-shadow: none;
  }
  .board-avatar-option.selected {
    border-color: var(--amber-strong);
    background: #fff3d6;
  }
  .board-avatar-option:active { transform: scale(0.94); }
  .board-avatar-option.reset { font-size: 12.5px; font-weight: 700; color: var(--muted); }

  .modal-text-input {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 8px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    font-size: 15.5px;
    font-weight: 700;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
  }
  .modal-text-input:focus { border-color: var(--amber-strong); }
  .modal-textarea {
    width: 100%;
    min-height: 90px;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    box-sizing: border-box;
  }
  .modal-textarea:focus { border-color: var(--amber-strong); }

  /* ---- 확인 모달 (confirm() 대체) ---- */
  .confirm-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(30,20,0,0.5);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .confirm-modal.show { display: flex; }
  .confirm-modal-inner {
    width: 100%;
    max-width: 340px;
    background: #fffdf7;
    border-radius: 18px;
    padding: 22px 20px;
    text-align: center;
  }
  .confirm-modal-message { margin: 0 0 18px; font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.5; }
  .confirm-modal-actions { display: flex; gap: 8px; }
  .confirm-modal-cancel, .confirm-modal-ok {
    flex: 1;
    width: auto;
    margin: 0;
    padding: 12px;
    font-size: 14.5px;
    font-weight: 700;
    border-radius: 12px;
  }
  .confirm-modal-cancel { background: #fff; color: #a3781c; border: 1.5px solid var(--line); box-shadow: none; }
  .confirm-modal-ok { background: var(--grad-amber); color: #fff; }
  .confirm-modal-ok.danger { background: linear-gradient(90deg, #e0507a, #d0304a); box-shadow: 0 8px 18px -7px rgba(208,48,74,0.6); }

  /* ---- 토스트 (alert() 대체) ---- */
  .toast-container {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 2000;
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
    align-items: center;
    pointer-events: none;
    width: 100%;
    padding: 0 16px;
    box-sizing: border-box;
  }
  .toast {
    pointer-events: auto;
    max-width: 420px;
    padding: 12px 18px;
    border-radius: 999px;
    background: #3b3227;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 10px 24px -10px rgba(0,0,0,0.5);
    animation: toastIn .22s ease, toastOut .22s ease 2.4s forwards;
  }
  .toast.success { background: #2f8f5b; }
  .toast.error { background: #d0304a; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }
  .board-auth { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .board-user-label { display: inline-flex; align-items: center; font-size: 13.5px; color: var(--muted); font-weight: 700; min-width: 0; word-break: break-word; }
  .board-login-btn, .board-logout-btn, .board-nickname-edit-btn {
    width: auto;
    margin: 0;
    padding: 9px 14px;
    font-size: 13.5px;
    border-radius: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .board-nickname-edit-btn {
    background: #fff;
    color: #a3781c;
    border: 1.5px solid var(--line);
    box-shadow: none;
  }
  .board-login-btn {
    background: linear-gradient(90deg, #fee500, #fada00);
    color: #3a2e00;
    box-shadow: 0 6px 14px -6px rgba(180,150,0,0.6);
  }
  .board-logout-btn {
    background: #fff;
    color: #a3781c;
    border: 1.5px solid var(--line);
    box-shadow: none;
  }

  .board-write { margin-bottom: 16px; }
  .board-attach-select {
    margin-bottom: 8px;
    font-size: 15px;
    padding: 11px 14px;
  }
  #boardWriteTitle {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 8px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    font-size: 15.5px;
    font-weight: 700;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
  }
  #boardWriteTitle:focus { border-color: var(--amber-strong); }
  #boardWriteText {
    width: 100%;
    min-height: 76px;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    font-size: 15.5px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    box-sizing: border-box;
  }
  #boardWriteText:focus { border-color: var(--amber-strong); }
  .board-write-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-top: 8px;
  }
  #boardWriteSubmit { width: auto; margin: 0; padding: 10px 20px; font-size: 15px; }
  .board-gate {
    text-align: center;
    padding: 40px 16px;
  }
  .board-gate-text {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .board-gate .board-login-btn {
    width: auto;
    display: inline-block;
    padding: 13px 24px;
    font-size: 15.5px;
  }

  .board-list { display: flex; flex-direction: column; gap: 12px; }
  .board-empty { text-align: center; color: var(--muted); font-size: 14.5px; line-height: 1.7; padding: 28px 12px; }

  /* ---- 로딩 스켈레톤 ---- */
  .skeleton {
    background: linear-gradient(100deg, #f3ead4 30%, #fff6df 50%, #f3ead4 70%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.4s ease-in-out infinite;
    border-radius: 6px;
  }
  @keyframes skeletonShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton-post {
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    background: #fff;
  }
  .skeleton-post-head { display: flex; align-items: center; gap: 8px; }
  .skeleton-avatar { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; }
  .skeleton-post-title { height: 15px; width: 65%; margin-top: 10px; }
  .skeleton-post-foot { display: flex; gap: 10px; margin-top: 12px; }
  .skeleton-pill { width: 36px; height: 12px; }
  .skeleton-result-card {
    flex: 0 0 auto;
    width: 168px;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 12px 13px;
    background: #fff;
  }
  .skeleton-result-nick { height: 11px; width: 50%; }
  .skeleton-result-name { height: 14px; width: 85%; margin-top: 8px; }
  .skeleton-result-score { height: 20px; width: 45%; margin-top: 6px; }
  .board-post {
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    background: #fff;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .board-post:active {
    transform: scale(0.99);
    box-shadow: 0 6px 16px -8px rgba(180,120,0,0.3);
  }
  .board-post-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .board-post-nick {
    display: flex;
    align-items: center;
    min-width: 0;
    font-weight: 700;
    color: var(--purple);
    font-size: 14.5px;
    word-break: break-word;
  }
  .board-post-time { font-size: 12.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .board-post-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    word-break: break-word;
  }
  .board-detail-inner .board-post-title { margin-bottom: 8px; }
  .board-post-body {
    font-size: 15px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
  }
  .board-result-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 7px 12px;
    border-radius: 999px;
    border-left: 3px solid var(--accent, var(--amber-strong));
    background: var(--panel);
    color: var(--accent, var(--amber-text));
    font-size: 13.5px;
    font-weight: 700;
  }
  .board-post-foot {
    display: flex;
    gap: 14px;
    margin-top: 10px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .board-post-foot span.liked { color: #e0507a; font-weight: 700; }
  .board-more-btn {
    background: #fff;
    color: #a3781c;
    border: 1.5px solid var(--line);
    box-shadow: none;
    margin-top: 4px;
  }

  .board-detail-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(30,20,0,0.5);
    padding: 16px;
    align-items: flex-end;
    justify-content: center;
  }
  .board-detail-modal.show { display: flex; }
  .board-detail-inner {
    position: relative;
    width: 100%;
    max-width: 480px;
    max-height: 86vh;
    overflow-y: auto;
    background: #fffdf7;
    border-radius: 22px 22px 12px 12px;
    padding: 22px 18px 18px;
  }
  .board-detail-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    color: #6b5d47;
    font-size: 15px;
    box-shadow: none;
  }
  /* 글 상세 팝업만 화면을 꽉 채우는 전체화면으로 띄운다(프로필・건의하기 팝업은 기존 바텀시트 유지) */
  #boardDetailModal { padding: 0; align-items: stretch; }
  #boardDetailModal .board-detail-inner {
    max-width: none;
    max-height: none;
    width: 100%;
    height: 100%;
    border-radius: 0;
    padding: 24px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .board-comments { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .board-comment {
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14.5px;
  }
  .board-comment-nick { font-weight: 700; color: var(--purple); margin-right: 6px; }
  .board-comment-write {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    position: sticky;
    bottom: 0;
    background: #fffdf7;
    padding-top: 6px;
  }
  #boardCommentText {
    flex: 1;
    padding: 11px 13px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    font-size: 14.5px;
    outline: none;
  }
  #boardCommentSubmit { width: auto; margin: 0; padding: 11px 16px; font-size: 14.5px; }
  .board-delete-btn {
    width: auto;
    margin: 0;
    padding: 6px 12px;
    font-size: 12.5px;
    background: #fff;
    color: #c0504f;
    border: 1.5px solid #f3d4d3;
    box-shadow: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="board-page-header">
    <a class="board-back-link" href="./">← 삐약궁합</a>
    <h1 class="board-page-title">💬 궁합 게시판</h1>
    <button type="button" class="board-feedback-btn" id="boardFeedbackBtn">💡 건의하기</button>
  </div>

  <div class="card board-card">

<script>
// index.html의 각 결과 화면이 계산을 마칠 때마다 localStorage에 남겨두는 가벼운
// 스냅샷(bbiyak_result_<kind>)을 읽어서 "결과 첨부" 드롭다운을 채운다.
function getAllResultSnapshots() {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith('bbiyak_result_')) continue;
    try {
      const data = JSON.parse(localStorage.getItem(key));
      if (data) out.push(data);
    } catch (e) { /* ignore */ }
  }
  return out;
}

function buildResultData(kind) {
  try {
    const raw = localStorage.getItem('bbiyak_result_' + kind);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function populateAttachSelect() {
  const sel = document.getElementById('boardAttachResult');
  const prevValue = sel.value;
  sel.innerHTML = '<option value="">📋 결과 첨부 안 함</option>';
  getAllResultSnapshots()
    .sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))
    .forEach((data) => {
      const opt = document.createElement('option');
      opt.value = data.kind;
      opt.textContent = `${data.emoji} ${data.label} · ${data.names || ''} ${data.score != null ? data.score + '점' : ''}`.trim();
      sel.appendChild(opt);
    });
  if ([...sel.options].some((o) => o.value === prevValue)) sel.value = prevValue;
}

document.getElementById('boardAttachResult').addEventListener('change', () => {
  const kind = document.getElementById('boardAttachResult').value;
  const textEl = document.getElementById('boardWriteText');
  if (!kind || textEl.value.trim()) return;
  const data = buildResultData(kind);
  if (!data) return;
  textEl.value = `${data.emoji} ${data.label} ${data.names || ''} ${data.score != null ? data.score + '점!' : ''}`.trim();
});

let boardSession = { loggedIn: false, nickname: '', kakaoId: '' };
let boardOffset = 0;
let boardLoadedOnce = false;
let boardSort = 'latest';
const BOARD_PAGE_SIZE = 20;

function timeAgo(ms) {
  const diff = Math.max(0, Date.now() - ms);
  const min = Math.floor(diff / 60000);
  if (min < 1) return '방금 전';
  if (min < 60) return `${min}분 전`;
  const hour = Math.floor(min / 60);
  if (hour < 24) return `${hour}시간 전`;
  const day = Math.floor(hour / 24);
  if (day < 7) return `${day}일 전`;
  const d = new Date(ms);
  return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 브라우저 기본 alert() 대신 쓰는 토스트. 2.6초 뒤 자동으로 사라진다.
function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast${type ? ' ' + type : ''}`;
  el.setAttribute('role', 'status');
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

// 브라우저 기본 confirm() 대신 쓰는 확인 모달. Promise<boolean>이라
// `if (!(await showConfirm('...'))) return;` 형태로 그대로 대체할 수 있다.
function showConfirm(message, opts) {
  const danger = !!(opts && opts.danger);
  return new Promise((resolve) => {
    const modal = document.getElementById('confirmModal');
    document.getElementById('confirmModalMessage').textContent = message;
    const okBtn = document.getElementById('confirmModalOk');
    const cancelBtn = document.getElementById('confirmModalCancel');
    okBtn.classList.toggle('danger', danger);
    okBtn.textContent = danger ? '삭제' : '확인';
    modal.classList.add('show');
    okBtn.focus();
    const cleanup = (result) => {
      modal.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      modal.removeEventListener('click', onBackdrop);
      document.removeEventListener('keydown', onKey);
      resolve(result);
    };
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    const onBackdrop = (e) => { if (e.target.id === 'confirmModal') cleanup(false); };
    const onKey = (e) => { if (e.key === 'Escape') cleanup(false); };
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    modal.addEventListener('click', onBackdrop);
    document.addEventListener('keydown', onKey);
  });
}

// 닉네임마다 고정된 색을 배정해서 게시판에 여러 사람이 있다는 느낌을 시각적으로 준다.
const AVATAR_COLORS = ['#ff8a65', '#f06292', '#ba68c8', '#7e93e0', '#4fc3f7', '#4db6ac', '#81c784', '#dba13a'];
function avatarColor(nickname) {
  let h = 0;
  for (const ch of String(nickname)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
// 프로필에서 고를 수 있는 귀여운 이모지 아바타 목록. api/update-profile.js의 허용 목록과 맞춰야 한다.
const AVATAR_OPTIONS = ['🐥', '🐣', '🐤', '🐰', '🐱', '🐶', '🦊', '🐻', '🐼', '🐨', '🐷', '🐹', '🦄', '🐢', '🦋', '🐸', '🐧', '🦁', '🐯', '🐮'];

function avatarHtml(nickname, avatar) {
  if (avatar && avatar.startsWith('data:image/')) {
    return `<img class="board-avatar photo" src="${escapeHtml(avatar)}" alt="">`;
  }
  if (avatar) return `<span class="board-avatar emoji">${escapeHtml(avatar)}</span>`;
  const initial = String(nickname).trim().slice(0, 1) || '🐥';
  return `<span class="board-avatar" style="background:${avatarColor(nickname)}">${escapeHtml(initial)}</span>`;
}

// 점수대별 강조색 · 뱃지. index.html의 TIERS 등급 색과 톤을 맞췄다.
const SCORE_TIERS = [
  { min: 90, badge: '👑', accent: '#ff5c7a' },
  { min: 75, badge: '💕', accent: '#f2711a' },
  { min: 60, badge: '😆', accent: '#f9a825' },
  { min: 45, badge: '🙂', accent: '#e0784f' },
  { min: 30, badge: '❓', accent: '#8d6a8c' },
  { min: 0,  badge: '😵', accent: '#5f6f92' },
];
function scoreTier(score) {
  return SCORE_TIERS.find((t) => score >= t.min) || SCORE_TIERS[SCORE_TIERS.length - 1];
}

async function refreshBoardSession() {
  try {
    const r = await fetch('/api/session');
    boardSession = await r.json();
  } catch (e) {
    boardSession = { loggedIn: false };
  }
  const logoutBtn = document.getElementById('boardLogoutBtn');
  const nicknameEditBtn = document.getElementById('boardNicknameEditBtn');
  const avatarEditBtn = document.getElementById('boardAvatarEditBtn');
  const gate = document.getElementById('boardGate');
  const content = document.getElementById('boardContent');

  logoutBtn.hidden = !boardSession.loggedIn;
  nicknameEditBtn.hidden = !boardSession.loggedIn;
  avatarEditBtn.hidden = !boardSession.loggedIn;
  renderUserLabel();
  gate.hidden = boardSession.loggedIn;
  content.hidden = !boardSession.loggedIn;

  if (boardSession.loggedIn) {
    populateAttachSelect();
    if (!boardLoadedOnce) {
      boardLoadedOnce = true;
      loadResultStrip();
      loadBoardPosts(true);
    }
  }
}

function renderUserLabel() {
  const userLabel = document.getElementById('boardUserLabel');
  userLabel.hidden = !boardSession.loggedIn;
  userLabel.innerHTML = boardSession.loggedIn
    ? `${avatarHtml(boardSession.nickname, boardSession.avatar)}${escapeHtml(boardSession.nickname)}님`
    : '';

document.getElementById('boardNicknameEditBtn').addEventListener('click', () => {
  document.getElementById('nicknameEditInput').value = boardSession.nickname || '';

document.getElementById('nicknameEditSubmit').addEventListener('click', async () => {
  const input = document.getElementById('nicknameEditInput');
  const trimmed = input.value.trim();
  if (!trimmed) { input.focus(); return; }
  if (trimmed === boardSession.nickname) {
    document.getElementById('nicknameEditModal').classList.remove('show');

  }

    const r = await fetch('/api/update-profile', {

    const data = await r.json();

      showToast('닉네임을 바꾸지 못했어요.', 'error');
      return;

    boardSession.nickname = data.nickname;

    document.getElementById('nicknameEditModal').classList.remove('show');
    showToast('닉네임을 바꿨어요.', 'success');
  } catch (e) {

  }

document.getElementById('postEditClose').addEventListener('click', () => {

document.getElementById('postEditSubmit').addEventListener('click', async () => {
  if (!editingPost) return;

    post.body = data.body;

async function submitAvatar(avatar) {
  if (avatar === (boardSession.avatar || null)) {
    document.getElementById('boardAvatarModal').classList.remove('show');
    return;
  }
  try {
    const r = await fetch('/api/update-profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ avatar }),
    });
    const data = await r.json();
    if (!r.ok) {
      showToast(r.status === 413 ? '사진 용량이 너무 커요. 다른 사진으로 시도해주세요.' : '프로필을 바꾸지 못했어요.', 'error');
      return;

    renderUserLabel();
    document.getElementById('boardAvatarModal').classList.remove('show');

    `<button type="button" class="board-avatar-option ${boardSession.avatar === emoji ? 'selected' : ''}" data-avatar="${emoji}">${emoji}</button>`
  ).join('');

  });

// 사진을 원본 그대로 올리면 용량이 커서, 캔버스로 정사각형으로 잘라 작은 크기로 줄인 뒤
// data URL(base64) 문자열로 만들어 이모지 아바타와 같은 방식(세션의 avatar 필드)으로 저장한다.
const AVATAR_PHOTO_SIZE = 96;
function fileToResizedDataUrl(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => { img.src = reader.result; };
    img.onerror = () => reject(new Error('decode failed'));
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = AVATAR_PHOTO_SIZE;
      canvas.height = AVATAR_PHOTO_SIZE;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, AVATAR_PHOTO_SIZE, AVATAR_PHOTO_SIZE);
      resolve(canvas.toDataURL('image/jpeg', 0.72));
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('boardAvatarPhotoBtn').addEventListener('click', () => {
  document.getElementById('boardAvatarFileInput').click();
});
document.getElementById('boardAvatarFileInput').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('이미지 파일만 올릴 수 있어요.', 'error'); return; }
  try {
    const dataUrl = await fileToResizedDataUrl(file);
    await submitAvatar(dataUrl);
  } catch (err) {
    showToast('사진을 불러오지 못했어요.', 'error');
  }
});

  document.getElementById('boardAvatarClose').focus();
});
document.getElementById('boardAvatarClose').addEventListener('click', () => {
  document.getElementById('boardAvatarModal').classList.remove('show');
});
document.getElementById('boardAvatarModal').addEventListener('click', (e) => {
  if (e.target.id === 'boardAvatarModal') document.getElementById('boardAvatarModal').classList.remove('show');
});

// 옛날에 올라온 글은 title 필드가 없을 수 있어(제목 기능 도입 전), 그런 글은 본문
// 앞부분을 잘라 제목처럼 보여준다.
function postTitleText(post) {
  if (post.title) return post.title;
  const body = (post.body || '').trim();
  if (!body) return '(제목 없음)';
  return body.length > 24 ? body.slice(0, 24) + '…' : body;
}

function renderResultChip(data) {
  if (!data) return '';
  const scoreText = data.score != null ? ` · ${data.score}점` : '';
  const tier = data.score != null ? scoreTier(data.score) : null;
  const style = tier ? ` style="--accent:${tier.accent}"` : '';
  const badge = tier ? `${tier.badge} ` : '';
  return `<div class="board-result-chip"${style}>${badge}${data.emoji} ${escapeHtml(data.label)} · ${escapeHtml(data.names || '')}${scoreText}${data.tierTitle ? ' · ' + escapeHtml(data.tierTitle) : ''}</div>`;
}

function renderBoardPostCard(post) {
  const el = document.createElement('div');
  el.className = 'board-post';
  el.dataset.id = post.id;
  el.innerHTML = `
    <div class="board-post-head">
      <span class="board-post-nick">${avatarHtml(post.nickname, post.avatar)}${escapeHtml(post.nickname)}</span>
      <span class="board-post-time">${timeAgo(post.createdAt)}</span>
    </div>
    <div class="board-post-title">${escapeHtml(postTitleText(post))}</div>
    <div class="board-post-foot">
      <span class="${post.likedByMe ? 'liked' : ''}">❤️ ${post.likeCount}</span>
      <span>💬 ${post.commentCount}</span>
    </div>
  `;
  el.addEventListener('click', () => openBoardDetail(post.id));
  return el;
}

function renderResultStripCard(post) {
  const data = post.resultData;
  const tier = data && data.score != null ? scoreTier(data.score) : null;
  const el = document.createElement('div');
  el.className = 'board-result-card';
  el.dataset.id = post.id;
  if (tier) el.style.setProperty('--accent', tier.accent);
  el.innerHTML = `
    <div class="board-result-nick">${avatarHtml(post.nickname, post.avatar)}${escapeHtml(post.nickname)}</div>
    <div class="board-result-names">${data ? escapeHtml(data.names || '') : ''}</div>
    ${data && data.score != null ? `<div class="board-result-score">${tier ? tier.badge + ' ' : ''}${data.score}점</div>` : ''}
    ${data && data.tierTitle ? `<div class="board-result-tier">${escapeHtml(data.tierTitle)}</div>` : ''}
    <div class="board-result-foot">❤️ ${post.likeCount} · 💬 ${post.commentCount}</div>
  `;
  el.addEventListener('click', () => openBoardDetail(post.id));
  return el;
}

function renderPostSkeleton() {
  const el = document.createElement('div');
  el.className = 'skeleton-post';
  el.innerHTML = `
    <div class="skeleton-post-head">
      <span class="skeleton skeleton-avatar"></span>
      <span class="skeleton skeleton-pill" style="width:44px;"></span>
    </div>
    <div class="skeleton skeleton-post-title"></div>
    <div class="skeleton-post-foot">
      <span class="skeleton skeleton-pill"></span>
      <span class="skeleton skeleton-pill"></span>
    </div>
  `;
  return el;
}

function renderResultSkeleton() {
  const el = document.createElement('div');
  el.className = 'skeleton-result-card';
  el.innerHTML = `
    <div class="skeleton skeleton-result-nick"></div>
    <div class="skeleton skeleton-result-name"></div>
    <div class="skeleton skeleton-result-score"></div>
  `;
  return el;
}

async function loadResultStrip() {
  const stripEl = document.getElementById('boardResultStrip');
  stripEl.innerHTML = '';
  for (let i = 0; i < 3; i++) stripEl.appendChild(renderResultSkeleton());
  try {
    const r = await fetch('/api/board?category=result&offset=0');
    const data = await r.json();
    stripEl.innerHTML = '';
    (data.posts || []).forEach((post) => stripEl.appendChild(renderResultStripCard(post)));
  } catch (e) {
    stripEl.innerHTML = '';
    // 비어 있으면 CSS ::after 안내 문구가 대신 보여진다
  }
}

async function loadBoardPosts(reset) {
  if (reset) boardOffset = 0;
  const listEl = document.getElementById('boardList');
  const moreBtn = document.getElementById('boardMoreBtn');
  if (reset) {
    listEl.innerHTML = '';
    for (let i = 0; i < 3; i++) listEl.appendChild(renderPostSkeleton());
  }

  try {
    const params = new URLSearchParams({ category: 'free', offset: String(boardOffset) });
    if (boardSort === 'popular') params.set('sort', 'popular');
    const r = await fetch(`/api/board?${params.toString()}`);
    const data = await r.json();
    if (reset) listEl.innerHTML = '';
    if (reset && (!data.posts || data.posts.length === 0)) {
      listEl.innerHTML = '<p class="board-empty">🐣 아직 자유글이 없어요<br>첫 글을 남겨서 게시판을 열어보세요!</p>';
    } else {
      (data.posts || []).forEach((post) => listEl.appendChild(renderBoardPostCard(post)));
    }
    boardOffset += BOARD_PAGE_SIZE;
    moreBtn.hidden = !data.hasMore;
  } catch (e) {
    if (reset) listEl.innerHTML = '<p class="board-empty">🥲 게시판을 불러오지 못했어요<br>잠시 후 다시 시도해주세요</p>';
  }
}

document.getElementById('boardMoreBtn').addEventListener('click', () => loadBoardPosts(false));

document.getElementById('boardSortToggle').querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (btn.dataset.sort === boardSort) return;
    boardSort = btn.dataset.sort;
    document.getElementById('boardSortToggle').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
    loadBoardPosts(true);
  });
});

document.getElementById('boardGateLoginBtn').addEventListener('click', () => {
  location.href = `/api/kakao-login?back=${encodeURIComponent('/board.html')}`;
});

document.getElementById('boardLogoutBtn').addEventListener('click', async () => {
  await fetch('/api/session', { method: 'POST' });
  await refreshBoardSession();
});

document.getElementById('boardWriteSubmit').addEventListener('click', async () => {
  const btn = document.getElementById('boardWriteSubmit');
  const titleEl = document.getElementById('boardWriteTitle');
  const textEl = document.getElementById('boardWriteText');
  const kind = document.getElementById('boardAttachResult').value;
  const title = titleEl.value.trim();
  const body = textEl.value.trim();
  if (!title) { titleEl.focus(); return; }
  if (!body) { textEl.focus(); return; }

  const resultData = kind ? buildResultData(kind) : null;
  const category = resultData ? 'result' : 'free';

  btn.disabled = true;
  try {
    const r = await fetch('/api/board', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category, title, body, resultData }),
    });
    const data = await r.json();
    if (!r.ok) {
      showToast(r.status === 429 ? '너무 빨리 연달아 올렸어요. 잠시 후 다시 시도해주세요.' : '글을 올리지 못했어요.', 'error');
      return;
    }
    titleEl.value = '';
    textEl.value = '';
    document.getElementById('boardAttachResult').value = '';
    if (data.post.category === 'result') {
      document.getElementById('boardResultStrip').prepend(renderResultStripCard(data.post));
    } else {
      document.getElementById('boardList').prepend(renderBoardPostCard(data.post));
      const empty = document.querySelector('#boardList .board-empty');
      if (empty) empty.remove();
    }
    showToast('게시글을 올렸어요 🐥', 'success');
  } catch (e) {
    showToast('글을 올리지 못했어요.', 'error');
  } finally {
    btn.disabled = false;
  }
});

let boardDetailPostId = null;
let editingPost = null;

async function openBoardDetail(id) {
  boardDetailPostId = id;
  const modal = document.getElementById('boardDetailModal');
  const bodyEl = document.getElementById('boardDetailBody');
  const commentsEl = document.getElementById('boardComments');
  bodyEl.innerHTML = `
    <div class="skeleton-post-head">
      <span class="skeleton skeleton-avatar"></span>
      <span class="skeleton skeleton-pill" style="width:60px;"></span>
    </div>
    <div class="skeleton skeleton-post-title" style="width:80%;height:20px;"></div>
    <div class="skeleton skeleton-post-title" style="width:95%;"></div>
    <div class="skeleton skeleton-post-title" style="width:60%;"></div>
  `;
  commentsEl.innerHTML = '';
  modal.classList.add('show');
  document.getElementById('boardDetailClose').focus();

  try {
    const r = await fetch(`/api/board-post?id=${encodeURIComponent(id)}`);
    if (!r.ok) { bodyEl.innerHTML = '<p class="board-empty">🔍 글을 찾을 수 없어요<br>삭제됐거나 잘못된 링크일 수 있어요</p>'; return; }
    const { post, comments } = await r.json();
    renderBoardDetail(post, comments);
  } catch (e) {
    bodyEl.innerHTML = '<p class="board-empty">🥲 불러오지 못했어요<br>잠시 후 다시 시도해주세요</p>';
  }
}

function renderBoardDetail(post, comments) {
  const bodyEl = document.getElementById('boardDetailBody');
  const isMine = boardSession.loggedIn && boardSession.kakaoId === post.kakaoId;
  bodyEl.innerHTML = `
    <div class="board-post-head">
      <span class="board-post-nick">${avatarHtml(post.nickname, post.avatar)}${escapeHtml(post.nickname)}</span>
      <span class="board-post-time">${timeAgo(post.createdAt)}</span>
    </div>
    <div class="board-post-title" id="boardDetailPostTitle">${escapeHtml(postTitleText(post))}</div>
    <div class="board-post-body" id="boardDetailPostBody">${escapeHtml(post.body)}</div>
    ${renderResultChip(post.resultData)}
    <div class="board-post-foot">
      <span class="board-like-btn ${post.likedByMe ? 'liked' : ''}" id="boardDetailLike" style="cursor:pointer" role="button" tabindex="0" aria-pressed="${post.likedByMe ? 'true' : 'false'}" aria-label="좋아요">❤️ <span id="boardDetailLikeCount">${post.likeCount}</span></span>
      <span>💬 ${post.commentCount}</span>
      ${isMine ? '<button type="button" class="board-delete-btn" id="boardDetailEdit">수정</button>' : ''}
      ${isMine ? '<button type="button" class="board-delete-btn" id="boardDetailDelete">삭제</button>' : ''}
      ${!isMine ? '<button type="button" class="board-delete-btn" id="boardDetailReport">🚩 신고</button>' : ''}
    </div>
  `;

  const commentsEl = document.getElementById('boardComments');
  commentsEl.innerHTML = comments.length
    ? comments.map((c) => `<div class="board-comment"><span class="board-comment-nick">${avatarHtml(c.nickname, c.avatar)}${escapeHtml(c.nickname)}</span>${escapeHtml(c.body)}</div>`).join('')
    : '<p class="board-empty">💬 아직 댓글이 없어요<br>첫 댓글을 남겨보세요</p>';

  document.getElementById('boardCommentWriteRow').hidden = !boardSession.loggedIn;

  document.getElementById('boardDetailLike').addEventListener('click', async () => {
    if (!boardSession.loggedIn) { showToast('좋아요는 로그인 후 누를 수 있어요.', 'error'); return; }
    try {
      const r = await fetch('/api/board-post', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ postId: post.id, action: 'like' }),
      });
      const data = await r.json();
      if (!r.ok) return;
      document.getElementById('boardDetailLike').classList.toggle('liked', data.liked);
      document.getElementById('boardDetailLike').setAttribute('aria-pressed', data.liked ? 'true' : 'false');
      document.getElementById('boardDetailLikeCount').textContent = data.likeCount;
      const listCardEl = document.querySelector(`.board-post[data-id="${post.id}"] .board-post-foot span:first-child`);
      if (listCardEl) {
        listCardEl.classList.toggle('liked', data.liked);
        listCardEl.textContent = `❤️ ${data.likeCount}`;
      }
      const stripCardEl = document.querySelector(`.board-result-card[data-id="${post.id}"] .board-result-foot`);
      if (stripCardEl) {
        const commentCount = post.commentCount || 0;
        stripCardEl.textContent = `❤️ ${data.likeCount} · 💬 ${commentCount}`;
      }
    } catch (e) { /* ignore */ }
  });
  document.getElementById('boardDetailLike').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); document.getElementById('boardDetailLike').click(); }
  });

  const deleteBtn = document.getElementById('boardDetailDelete');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', async () => {
      if (!(await showConfirm('이 글을 삭제할까요?', { danger: true }))) return;
      try {
        const r = await fetch('/api/board-post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postId: post.id, action: 'delete' }),
        });
        if (!r.ok) { showToast('삭제하지 못했어요.', 'error'); return; }
        document.getElementById('boardDetailModal').classList.remove('show');
        const listCardEl = document.querySelector(`.board-post[data-id="${post.id}"]`);
        if (listCardEl) listCardEl.remove();
        const stripCardEl = document.querySelector(`.board-result-card[data-id="${post.id}"]`);
        if (stripCardEl) stripCardEl.remove();
        showToast('삭제했어요.', 'success');
      } catch (e) {
        showToast('삭제하지 못했어요.', 'error');
      }
    });
  }

  const editBtn = document.getElementById('boardDetailEdit');
  if (editBtn) {
    editBtn.addEventListener('click', () => {
      editingPost = post;
      document.getElementById('postEditTitle').value = post.title || postTitleText(post);
      document.getElementById('postEditBody').value = post.body;
      document.getElementById('postEditModal').classList.add('show');
      document.getElementById('postEditTitle').focus();
    });
  }

  const reportBtn = document.getElementById('boardDetailReport');
  if (reportBtn) {
    reportBtn.addEventListener('click', async () => {
      if (!(await showConfirm('이 글을 신고할까요? 운영자가 확인 후 조치해요.'))) return;
      try {
        const r = await fetch('/api/board-post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postId: post.id, action: 'report' }),
        });
        const data = await r.json();
        if (!r.ok) { showToast('신고하지 못했어요.', 'error'); return; }
        showToast(data.alreadyReported ? '이미 신고한 글이에요.' : '신고했어요. 운영자가 확인할게요.', 'success');
        reportBtn.disabled = true;
      } catch (e) {
        showToast('신고하지 못했어요.', 'error');
      }
    });
  }
}

document.getElementById('boardDetailClose').addEventListener('click', () => {
  document.getElementById('boardDetailModal').classList.remove('show');
});
document.getElementById('boardDetailModal').addEventListener('click', (e) => {
  if (e.target.id === 'boardDetailModal') document.getElementById('boardDetailModal').classList.remove('show');
});

// ============================================================
// 건의사항 (로그인 없이도 누구나 보낼 수 있는, 운영자에게만 보이는 의견함)
// ============================================================
function getDeviceId() {
  let id = '';
  try { id = localStorage.getItem('bbiyak_device_id') || ''; } catch (e) { /* 무시 */ }
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
    try { localStorage.setItem('bbiyak_device_id', id); } catch (e) { /* 무시 */ }
  }
  return id;
}

document.getElementById('boardFeedbackBtn').addEventListener('click', () => {
  document.getElementById('boardFeedbackModal').classList.add('show');
  document.getElementById('boardFeedbackText').focus();
});
document.getElementById('boardFeedbackClose').addEventListener('click', () => {
  document.getElementById('boardFeedbackModal').classList.remove('show');
});
document.getElementById('boardFeedbackModal').addEventListener('click', (e) => {
  if (e.target.id === 'boardFeedbackModal') document.getElementById('boardFeedbackModal').classList.remove('show');
});
document.getElementById('boardFeedbackSubmit').addEventListener('click', async () => {
  const textEl = document.getElementById('boardFeedbackText');
  const text = textEl.value.trim();
  if (!text) { textEl.focus(); return; }
  const btn = document.getElementById('boardFeedbackSubmit');
  btn.disabled = true;
  try {
    const r = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: text, deviceId: getDeviceId() }),
    });
    if (!r.ok) {
      showToast(r.status === 429 ? '너무 빨리 연달아 보냈어요. 잠시 후 다시 시도해주세요.' : '보내지 못했어요.', 'error');
      return;
    }
    textEl.value = '';
    document.getElementById('boardFeedbackModal').classList.remove('show');
    showToast('의견 감사해요! 꼼꼼히 읽어볼게요 🐥', 'success');
  } catch (e) {
    showToast('보내지 못했어요.', 'error');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('boardCommentSubmit').addEventListener('click', async () => {
  const input = document.getElementById('boardCommentText');
  const text = input.value.trim();
  if (!text || !boardDetailPostId) return;
  try {
    const r = await fetch('/api/board-post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ postId: boardDetailPostId, action: 'comment', body: text }),
    });
    const data = await r.json();
    if (!r.ok) {
      showToast(r.status === 429 ? '너무 빨리 연달아 남겼어요. 잠시 후 다시 시도해주세요.' : '댓글을 남기지 못했어요.', 'error');
      return;
    }
    const commentsEl = document.getElementById('boardComments');
    const empty = commentsEl.querySelector('.board-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'board-comment';
    div.innerHTML = `<span class="board-comment-nick">${avatarHtml(data.comment.nickname, data.comment.avatar)}${escapeHtml(data.comment.nickname)}</span>${escapeHtml(data.comment.body)}`;
    commentsEl.appendChild(div);
    input.value = '';
    const listCardEl = document.querySelector(`.board-post[data-id="${boardDetailPostId}"] .board-post-foot span:last-child`);
    if (listCardEl) {
      const n = (parseInt(listCardEl.textContent.replace(/\D/g, ''), 10) || 0) + 1;
      listCardEl.textContent = `💬 ${n}`;
    }
    const stripCardEl = document.querySelector(`.board-result-card[data-id="${boardDetailPostId}"] .board-result-foot`);
    if (stripCardEl) {
      const n = (parseInt(stripCardEl.textContent.match(/💬 (\d+)/)?.[1], 10) || 0) + 1;
      const likeMatch = stripCardEl.textContent.match(/❤️ (\d+)/);
      stripCardEl.textContent = `❤️ ${likeMatch ? likeMatch[1] : 0} · 💬 ${n}`;
    }
  } catch (e) { /* ignore */ }
});

document.getElementById('boardCommentText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('boardCommentSubmit').click();
});

if (new URLSearchParams(location.search).get('loginError')) {
  setTimeout(() => showToast('카카오 로그인에 실패했어요. 다시 시도해주세요.', 'error'), 300);
}

// Esc로 현재 열려있는 팝업(바텀시트/상세)을 전부 닫을 수 있게 한다. 확인 모달은
// showConfirm() 안에서 이미 자체적으로 Esc를 처리한다.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.board-detail-modal.show').forEach((m) => m.classList.remove('show'));
});

refreshBoardSession();
